<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>GALAXY 철민 디펜더</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030817;color:#fff;font-family:system-ui,sans-serif;touch-action:none}body{display:flex;align-items:center;justify-content:center}.wrap{width:100vw;height:100dvh;display:flex;flex-direction:column;background:radial-gradient(ellipse at 50% 30%,#101d46,#030817 75%)}header{height:42px;display:flex;align-items:center;justify-content:space-around;font-weight:800;color:#bdeaff;letter-spacing:.04em;font-size:clamp(12px,2.5vh,18px)}header span b{color:#fff;margin-left:5px}canvas{display:block;width:100%;flex:1;min-height:0;touch-action:none}.controls{height:65px;display:flex;justify-content:space-around;align-items:center;gap:12px;padding:5px 14px}.controls button,.overlay button{border:1px solid #5b8bd7;border-radius:14px;background:linear-gradient(#1c4382,#10244b);color:white;font-weight:900;font-size:25px;min-width:78px;height:48px}.controls .hint{font-size:11px;text-align:center;color:#b8c9e8;line-height:1.4}.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;background:#030817df;padding:20px}.overlay h1{font-size:clamp(25px,7vw,46px);line-height:1.1;color:#68e7ff;text-shadow:0 0 18px #009dff;margin:0 0 8px}.overlay p{color:#d2e1ff;font-size:14px}.overlay button{font-size:18px;padding:0 30px;margin-top:14px}.stage{position:relative;flex:1;min-height:0;display:flex}
</style></head><body><main class="wrap"><header><span>SCORE<b id="score">0</b></span><span>철민 디펜더</span><span>LIFE<b id="life">♥ ♥ ♥</b></span><span>LV<b id="level">1</b></span></header><div class="stage"><canvas id="game"></canvas><div class="overlay" id="overlay"><h1>GALAXY<br>철민 디펜더</h1><p>외계 함대를 물리치고 은하계를 지켜라!<br>화면을 드래그하거나 좌우 버튼으로 이동하세요.</p><button id="start">게임 시작 ▶</button></div></div><div class="controls"><button id="left">◀</button><div class="hint">자동 발사<br>적을 격추하세요!</div><button id="right">▶</button></div></main><script>
(()=>{const c=document.getElementById('game'),ctx=c.getContext('2d'),$=id=>document.getElementById(id);let W=800,H=500,player,bullets,enemies,stars,score,lives,level,run=false,ended=false,frame=0,spawn=0,keys={},last=0;function resize(){let r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);c.width=Math.round(r.width*d);c.height=Math.round(r.height*d);W=c.width;H=c.height;if(player)player.y=H*.88;}function reset(){score=0;lives=3;level=1;frame=0;spawn=0;bullets=[];enemies=[];player={x:W/2,y:H*.88,inv:0};stars=Array.from({length:90},()=>({x:Math.random()*W,y:Math.random()*H,s:1+Math.random()*2}));stats();draw()}function stats(){$('score').textContent=score;$('life').textContent='♥ '.repeat(lives).trim();$('level').textContent=level}function start(){if(run)return;if(ended)reset();ended=false;run=true;$('overlay').style.display='none';last=performance.now();requestAnimationFrame(loop)}function finish(){run=false;ended=true;$('overlay').style.display='flex';$('overlay').innerHTML=`<h1 style="color:#ff829e">GAME OVER</h1><p>최종 점수 : ${score}</p><button id="again">다시 도전 ↻</button>`;$('again').onclick=()=>{reset();start()}}function ship(x,y){ctx.save();ctx.translate(x,y);ctx.fillStyle='#55eaff';ctx.shadowColor='#00dfff';ctx.shadowBlur=22;ctx.beginPath();ctx.moveTo(0,-25);ctx.lineTo(22,19);ctx.lineTo(5,12);ctx.lineTo(0,20);ctx.lineTo(-5,12);ctx.lineTo(-22,19);ctx.closePath();ctx.fill();ctx.fillStyle='white';ctx.beginPath();ctx.arc(0,-5,6,0,7);ctx.fill();ctx.restore()}function enemy(e){ctx.save();ctx.translate(e.x,e.y);ctx.fillStyle=e.color;ctx.shadowColor=e.color;ctx.shadowBlur=14;ctx.beginPath();ctx.moveTo(-21,-7);ctx.lineTo(-10,-18);ctx.lineTo(0,-11);ctx.lineTo(10,-18);ctx.lineTo(21,-7);ctx.lineTo(16,12);ctx.lineTo(0,18);ctx.lineTo(-16,12);ctx.closePath();ctx.fill();ctx.fillStyle='#fff';ctx.fillRect(-10,-5,6,6);ctx.fillRect(4,-5,6,6);ctx.restore()}function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#030817';ctx.fillRect(0,0,W,H);stars.forEach(s=>{ctx.fillStyle='rgba(175,220,255,.7)';ctx.fillRect(s.x,s.y,s.s,s.s)});bullets.forEach(b=>{ctx.fillStyle='#8fffff';ctx.shadowColor='#00eaff';ctx.shadowBlur=15;ctx.fillRect(b.x-3,b.y-12,6,19)});ctx.shadowBlur=0;enemies.forEach(enemy);if(player.inv%10<6||!player.inv)ship(player.x,player.y)}function loop(t){if(!run)return;let dt=Math.min((t-last)/16.67,2);last=t;frame++;if(keys.left)player.x-=7*dt;if(keys.right)player.x+=7*dt;player.x=Math.max(25,Math.min(W-25,player.x));if(frame%12===0)bullets.push({x:player.x,y:player.y-25});if(--spawn<=0){enemies.push({x:35+Math.random()*(W-70),y:-25,v:(1.5+level*.25+Math.random())*(W/800),color:['#ff648d','#ffc65c','#b38aff','#6dffb5'][Math.floor(Math.random()*4)]});spawn=Math.max(22,70-level*5)}bullets.forEach(b=>b.y-=12*dt);enemies.forEach(e=>e.y+=e.v*dt);for(let i=enemies.length-1;i>=0;i--){let e=enemies[i],hit=false;for(let j=bullets.length-1;j>=0;j--){let b=bullets[j];if(Math.abs(e.x-b.x)<23&&Math.abs(e.y-b.y)<25){bullets.splice(j,1);hit=true;score+=10;break}}if(hit){enemies.splice(i,1);continue}if(e.y>player.y-22&&e.y<player.y+28&&Math.abs(e.x-player.x)<35){enemies.splice(i,1);if(!player.inv){lives--;player.inv=75;stats();if(lives<=0){finish();return}}}else if(e.y>H+30)enemies.splice(i,1)}if(player.inv>0)player.inv--;bullets=bullets.filter(b=>b.y>-20);let lv=1+Math.floor(score/150);if(lv!==level)level=lv;stars.forEach(s=>{s.y+=s.s*dt*1.5;if(s.y>H){s.y=0;s.x=Math.random()*W}});stats();draw();requestAnimationFrame(loop)}function movePointer(e){let r=c.getBoundingClientRect();player.x=Math.max(25,Math.min(W-25,(e.clientX-r.left)/r.width*W))}c.addEventListener('pointerdown',e=>{if(run)movePointer(e)});c.addEventListener('pointermove',e=>{if(run&&e.buttons)movePointer(e)});function hold(id,k){let b=$(id);b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true});['pointerup','pointerleave','pointercancel'].forEach(v=>b.addEventListener(v,()=>keys[k]=false))}hold('left','left');hold('right','right');$('start').onclick=start;window.addEventListener('resize',()=>{resize();draw()});resize();reset()})();
</script></body></html>
